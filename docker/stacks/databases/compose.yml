# Databases stack — sobe todos os bancos e gerenciadores de uma vez.
#
# Pré-requisito: As .env são geradas automaticamente pelo NixOS (secrets.nix)
#   via sops-nix. Não edite manualmente — altere em secrets.yaml e rebuild.
#
# Uso:
#   zstack up databases          # sobe tudo
#   zstack down databases        # derruba tudo
#   zstack up databases/postgres # sobe apenas o postgres (via sub-pasta)
#
# AVISO: SQL Server exige no mínimo 2 GB de RAM. Comente o bloco abaixo
# se o host não tiver memória suficiente.
services:

  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - "./postgres/.env"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD é obrigatório}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - databases
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MySQL ────────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - "./mysql/.env"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD é obrigatório}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD é obrigatório}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - databases
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - "./redis/.env"
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD é obrigatório}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - databases
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── SQL Server ───────────────────────────────────────────────────────────────
  # AVISO: requer mínimo 2 GB RAM. Comente este bloco em hosts com pouca memória.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    env_file:
      - "./sqlserver/.env"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD é obrigatório}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1434}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - databases
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' -C || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─── Adminer (gerenciador web leve) ──────────────────────────────────────────
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8083}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: ${ADMINER_DEFAULT_SERVER:-host.docker.internal}
      ADMINER_DESIGN: ${ADMINER_DESIGN:-pepa-linha}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - databases

  # ─── CloudBeaver (IDE web para bancos) ───────────────────────────────────────
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLOUDBEAVER_PORT:-8979}:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - databases

volumes:
  postgres_data:
  mysql_data:
  redis_data:
  sqlserver_data:
  cloudbeaver_data:

networks:
  databases:
    name: databases
    driver: bridge