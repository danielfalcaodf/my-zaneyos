# CloudBeaver — web SQL IDE. Used in Medium/Full editions.
# Access: http://localhost:8978 (or via Caddy: http://cloudbeaver.localhost)
# First run: complete setup wizard to set admin password.
services:
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8978:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  cloudbeaver_data:
