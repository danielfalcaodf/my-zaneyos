# Adminer — lightweight web DB manager. Used in Basic/VM editions.
# Access: http://localhost:8082 (or via Caddy: http://db.localhost)
# Connect to postgres/mysql running in other stacks via host.docker.internal.
services:
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      ADMINER_DEFAULT_SERVER: ${ADMINER_DEFAULT_SERVER:-host.docker.internal}
      ADMINER_DESIGN: ${ADMINER_DESIGN:-pepa-linha}
    extra_hosts:
      - "host.docker.internal:host-gateway"
