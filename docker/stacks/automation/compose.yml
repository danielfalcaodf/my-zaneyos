# Automation stack — sobe todos os serviços de automação de uma vez.
#
# Pré-requisito: copie os .env de cada sub-stack antes de subir:
#   zstack init automation
#
# Uso:
#   zstack up automation          # sobe tudo
#   zstack down automation        # derruba tudo
#   zstack up automation/n8n      # sobe apenas o n8n (via sub-pasta)
services:

  # ─── Mailpit ─────────────────────────────────────────────────────────────────
  # SMTP local para desenvolvimento. Sem secrets — sem .env necessário.
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # web UI
      - "127.0.0.1:1025:1025" # SMTP
    volumes:
      - mailpit_data:/data
    environment:
      - MP_MAX_MESSAGES=5000
      - MP_DATABASE=/data/mailpit.db
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
    networks:
      - automation

  # ─── n8n ─────────────────────────────────────────────────────────────────────
  # Automação de workflows. Requer ./n8n/.env com N8N_ENCRYPTION_KEY.
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    env_file:
      - "./n8n/.env"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - automation
      - n8n_internal
    depends_on:
      n8n_postgres:
        condition: service_healthy

  n8n_postgres:
    image: postgres:16-alpine
    container_name: n8n_postgres
    restart: unless-stopped
    env_file:
      - "./n8n/.env"
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    networks:
      - n8n_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Uptime Kuma ─────────────────────────────────────────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - automation

  # ─── Woodpecker CI ───────────────────────────────────────────────────────────
  # Requer ./woodpecker/.env com WOODPECKER_GITHUB_CLIENT/SECRET e AGENT_SECRET.
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v3
    container_name: woodpecker-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - woodpecker-server-data:/var/lib/woodpecker/
    env_file:
      - "./woodpecker/.env"
    networks:
      - automation

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3
    container_name: woodpecker-agent
    command: agent
    restart: unless-stopped
    depends_on:
      - woodpecker-server
    volumes:
      - woodpecker-agent-config:/etc/woodpecker
      # AVISO: montar /var/run/docker.sock concede ao agent controle total
      # sobre o daemon Docker do host. Use apenas em ambientes controlados.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WOODPECKER_SERVER=woodpecker-server:9000
    env_file:
      - "./woodpecker/.env"
    networks:
      - automation

volumes:
  mailpit_data:
  n8n_data:
  n8n_postgres_data:
  uptime_kuma_data:
  woodpecker-server-data:
  woodpecker-agent-config:

networks:
  automation:
    name: automation
    driver: bridge
  n8n_internal:
    name: n8n_internal
    driver: bridge
