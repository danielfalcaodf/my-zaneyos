# Portainer CE — Docker management UI. Bind 127.0.0.1 only.
# Access: http://localhost:9000 (or via Caddy: http://portainer.localhost)
# First run: set admin password within 5 minutes or container locks.
services:
  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data

volumes:
  portainer_data:
