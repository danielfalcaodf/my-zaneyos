services:
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: caddy
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:80:80"
  #     - "127.0.0.1:443:443"
  #   volumes:
  #     - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   networks:
  #     - caddy
  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOMEPAGE_HOST_PORT:-3003}:3000"
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - "./homepage/.env"
    networks:
      - homepage
  # Technitium DNS — Web UI for DNS management
  technitium-dns:
    image: technitium/dns-server:latest
    container_name: technitium-dns
    restart: unless-stopped
    ports:
      - "127.0.0.1:5380:5380"  # Web UI
      - "127.0.0.1:53:53/udp"  # DNS UDP
      - "127.0.0.1:53:53/tcp"  # DNS TCP
    env_file:
      - "./technitium-dns/.env"
    volumes:
      - technitium_dns_data:/etc/dns
    networks:
      - technitium
    cap_add:
      - NET_BIND_SERVICE
volumes:
  # caddy_data:
  # caddy_config:
  portainer_data:
  technitium_dns_data:

networks:
  # caddy:
  #   name: caddy
  #   driver: bridge
  homepage:
    name: homepage
    driver: bridge
  technitium:
    name: technitium
    driver: bridge
