# AIO Sandbox — ambiente all-in-one (browser, terminal, VSCode, Jupyter, MCP) para agentes de IA.
#
# Pré-requisito:
#   zstack init llm
#   mkdir -p ~/repos   # pasta de trabalho montada no sandbox
#
# Uso:
#   zstack up llm/aio-sandbox
#
# Acesso:
#   https://sandbox.homelab.lan/v1/docs        (API + Swagger)
#   https://sandbox.homelab.lan/code-server/   (VSCode)
#   https://sandbox.homelab.lan/mcp            (MCP Hub para agentes)
services:
  aio-sandbox:
    image: ghcr.io/agent-infra/sandbox:latest
    container_name: aio-sandbox
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SANDBOX_HOST_PORT:-8090}:8080"
    env_file:
      - "./.env"
    environment:
      WORKSPACE: ${WORKSPACE:-/home/gem/repos}
      TZ: ${TZ:-America/Sao_Paulo}
      PROXY_SERVER: ${PROXY_SERVER:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      DNS_OVER_HTTPS_TEMPLATES: ${DNS_OVER_HTTPS_TEMPLATES:-}
      BROWSER_EXTRA_ARGS: ${BROWSER_EXTRA_ARGS:-}
      WAIT_PORTS: ${WAIT_PORTS:-}
    volumes:
      - "${REPOS_DIR:-${HOME}/repos}:/home/gem/repos"
    security_opt:
      - seccomp:unconfined
    shm_size: "2gb"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - aio-sandbox

networks:
  aio-sandbox:
    name: aio-sandbox
    driver: bridge
