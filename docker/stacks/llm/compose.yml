# LLM stack — Open WebUI para interagir com modelos via Ollama.
#
# Pré-requisito:
#   zstack init llm
#   # Ollama deve estar rodando no host (ativo via modules/editions/full.nix)
#
# Uso:
#   zstack up llm
services:

  # ─── Open WebUI ──────────────────────────────────────────────────────────────
  # Interface web para modelos Ollama rodando no host.
  # Ollama deve estar ativo: systemctl status ollama
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENWEBUI_PORT:-8080}:8080"
    env_file:
      - "./open-webui/.env"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host-gateway:11434}
    volumes:
      - open_webui_data:/app/backend/data
    extra_hosts:
      - "host-gateway:host-gateway"
    networks:
      - llm

volumes:
  open_webui_data:

networks:
  llm:
    name: llm
    driver: bridge
